worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # 不记录URL参数、Cookie、Authorization或请求体。
    log_format safe '$remote_addr $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    server {
        listen 8443 ssl;
        server_name localhost;
        ssl_certificate /run/secrets/tls_certificate;
        ssl_certificate_key /run/secrets/tls_private_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        location = /healthz { access_log off; return 200 'ok'; }
        location = /health/ready {
            proxy_pass http://api:18080/actuator/health/readiness;
            proxy_set_header Host $http_host;
        }
        location /api/ {
            proxy_pass http://api:18080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Forwarded '';
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            # 全量同步默认可含两次180秒ERP读取及60秒本地发布，须覆盖前端450秒等待。
            proxy_read_timeout 480s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }
        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 1y;
        }
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
