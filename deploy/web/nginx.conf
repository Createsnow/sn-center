worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # 不记录URL参数、Cookie、Authorization或请求体。
    log_format safe '$remote_addr $request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    sendfile on;
    server {
        # 容器内只监听 HTTP 8080；TLS 由入口层终止，入口必须只对外提供 HTTPS。
        listen 8080;
        server_name _;
        # SN 导入的 xlsx 最大 20 MB
        client_max_body_size 24m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        # /healthz：Web 自身存活；/health/ready：经 API 就绪探针（含数据库）。
        location = /healthz { access_log off; return 200 'ok'; }
        location = /health/ready {
            proxy_pass http://api:18100/actuator/health/readiness;
            proxy_set_header Host $http_host;
        }
        # MES 对外接口：保持原系统地址 /api/mes/v1/*，改写到 /api/v1/sn/mes/*（应答体与原系统相同）
        location /api/mes/v1/ {
            rewrite ^/api/mes/v1/(.*)$ /api/v1/sn/mes/$1 break;
            proxy_pass http://api:18100;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Forwarded '';
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
            proxy_buffering off;
        }
        location /api/ {
            proxy_pass http://api:18100;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            # 入口层只接受 HTTPS，因此对 API 固定声明 https。
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Forwarded '';
            proxy_set_header Connection '';
            proxy_connect_timeout 5s;
            # 导出百万行 xlsx、全量重建订单快照可能较久
            proxy_read_timeout 600s;
            proxy_send_timeout 120s;
            proxy_buffering off;
        }
        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            expires 1y;
        }
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
}
