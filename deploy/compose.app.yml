# 接入项目自己的 MySQL/Redis/TLS。先单独 migrate，再启动 API/Web。
name: adtek-platform-template-app
services:
  migrate:
    image: adtek-platform-template-api:0.1.0
    profiles: [migrate]
    command: [--migrate, --apply]
    environment:
      ADTEK_DB_URL: ${ADTEK_DB_URL:?Database URL required}
      ADTEK_MIGRATION_USER: ${ADTEK_MIGRATION_USER:?Migration user required}
      ADTEK_MIGRATION_ALLOWED_SCHEMA: ${ADTEK_MIGRATION_ALLOWED_SCHEMA:?Allowed schema required}
    secrets:
      - ADTEK_MIGRATION_PASSWORD
    read_only: true
    tmpfs: [/tmp]
  api:
    image: adtek-platform-template-api:0.1.0
    environment:
      ADTEK_DB_URL: ${ADTEK_DB_URL:?Database URL required}
      ADTEK_DB_USER: ${ADTEK_DB_USER:?Application user required}
      ADTEK_REDIS_HOST: ${ADTEK_REDIS_HOST:?Redis host required}
      ADTEK_REDIS_PORT: ${ADTEK_REDIS_PORT:-6379}
      ADTEK_SERVER_ADDRESS: 0.0.0.0
      ADTEK_SERVER_PORT: 18090
      ADTEK_FILE_ROOT: /app/var/files
      SPRING_FLYWAY_ENABLED: 'false'
    secrets: [ADTEK_DB_PASSWORD, ADTEK_REDIS_PASSWORD, ADTEK_JWT_SECRET]
    volumes: [task_files:/app/var/files]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, java, -jar, /app/app.jar, --healthcheck]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
  web:
    image: adtek-platform-template-web:0.1.0
    ports: ['127.0.0.1:18453:8443']
    secrets: [tls_certificate, tls_private_key]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
secrets:
  ADTEK_DB_PASSWORD: { file: './.secrets/app-db-password' }
  ADTEK_MIGRATION_PASSWORD: { file: './.secrets/app-migration-password' }
  ADTEK_REDIS_PASSWORD: { file: './.secrets/app-redis-password' }
  ADTEK_JWT_SECRET: { file: './.secrets/app-jwt-key' }
  tls_certificate: { file: './.secrets/tls-certificate.pem' }
  tls_private_key: { file: './.secrets/tls-private-key.pem' }
volumes:
  task_files:
