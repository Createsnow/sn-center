# MySQL 基础设施：Windows 本地开发单独使用；Linux 单机部署与 compose.yml 合并使用。
# 端口只绑定 127.0.0.1；命名卷不随 stop/down 删除。生产可改用托管 MySQL 而不启用本文件。
name: sn-center
services:
  mysql:
    image: mysql:8.4.11@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ADTEK_MYSQL_PORT:-33326}:3306'
    environment:
      MYSQL_DATABASE: sn_center
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --default-time-zone=+00:00
      - --max-connections=120
      - --local-infile=OFF
    secrets:
      - mysql_root_password
      - mysql_app_password
      - mysql_migration_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init-users.sh:/docker-entrypoint-initdb.d/10-users.sh:ro
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysql -uroot --silent --execute="SELECT 1" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    mem_limit: 2g
secrets:
  mysql_root_password:
    file: ./.secrets/mysql-root-password
  mysql_app_password:
    file: ./.secrets/mysql-app-password
  mysql_migration_password:
    file: ./.secrets/mysql-migration-password
volumes:
  mysql_data:
