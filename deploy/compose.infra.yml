# MySQL / Redis 基础设施：Windows 本地开发单独使用；Linux 单机部署与 compose.yml 合并使用。
# 端口只绑定 127.0.0.1；命名卷不随 stop/down 删除。生产可改用托管 MySQL/Redis 而不启用本文件。
name: adtek-platform-template
services:
  mysql:
    image: mysql:8.4.11@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ADTEK_MYSQL_PORT:-33316}:3306'
    environment:
      MYSQL_DATABASE: adtek_template
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --default-time-zone=+00:00
      - --max-connections=120
      - --local-infile=OFF
    secrets:
      - mysql_root_password
      - mysql_app_password
      - mysql_migration_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init-users.sh:/docker-entrypoint-initdb.d/10-users.sh:ro
    healthcheck:
      test:
        [
          CMD-SHELL,
          'MYSQL_PWD="$$(cat /run/secrets/mysql_root_password)" mysql -uroot --silent --execute="SELECT 1" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s
    mem_limit: 2g
  redis:
    image: redis:8.4.7-alpine@sha256:0514fa59e3d84e2f3be66731c5401fc2a85b8ea71b49c0116c850f6a558076f4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ADTEK_REDIS_PORT:-36389}:6379'
    entrypoint: [sh, /opt/adtek/start-redis.sh]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
      - ./redis/start-redis.sh:/opt/adtek/start-redis.sh:ro
    tmpfs:
      - /run/redis:mode=0700
    healthcheck:
      test:
        [
          CMD-SHELL,
          'REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping | grep -qx PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
secrets:
  mysql_root_password:
    file: ./.secrets/mysql-root-password
  mysql_app_password:
    file: ./.secrets/mysql-app-password
  mysql_migration_password:
    file: ./.secrets/mysql-migration-password
  redis_password:
    file: ./.secrets/redis-password
volumes:
  mysql_data:
  redis_data:
