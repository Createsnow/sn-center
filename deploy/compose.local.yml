# 与 compose.test.yml 合并；复用本工程隔离设施，应用通过内部网络连接。
x-api: &api
  image: adtek-platform-template-api:0.1.0
  environment: &api-environment
    ADTEK_DB_URL: jdbc:mysql://mysql:3306/adtek_template_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED
    ADTEK_DB_USER: adtek_app
    ADTEK_REDIS_HOST: redis
    ADTEK_REDIS_PORT: 6379
    ADTEK_SERVER_ADDRESS: 0.0.0.0
    ADTEK_SERVER_PORT: 18090
    ADTEK_FILE_ROOT: /app/var/files
    SPRING_FLYWAY_ENABLED: 'false'
  secrets: [ADTEK_DB_PASSWORD, ADTEK_REDIS_PASSWORD, ADTEK_JWT_SECRET]
  volumes: [task_files:/app/var/files]
  read_only: true
  tmpfs: [/tmp]
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_healthy }

services:
  migrate:
    image: adtek-platform-template-api:0.1.0
    profiles: [setup]
    command: [--migrate, --apply]
    environment:
      ADTEK_DB_URL: jdbc:mysql://mysql:3306/adtek_template_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED
      ADTEK_MIGRATION_USER: adtek_migration
      ADTEK_MIGRATION_ALLOWED_SCHEMA: adtek_template_test
    secrets: [ADTEK_MIGRATION_PASSWORD]
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      mysql: { condition: service_healthy }
  bootstrap:
    <<: *api
    profiles: [setup]
    command: [--spring.main.web-application-type=none]
    environment:
      <<: *api-environment
      SPRING_PROFILES_ACTIVE: bootstrap-admin
      ADTEK_BOOTSTRAP_USERNAME: admin
      ADTEK_TASKS_ENABLED: 'false'
    secrets:
      - ADTEK_DB_PASSWORD
      - ADTEK_REDIS_PASSWORD
      - ADTEK_JWT_SECRET
      - ADTEK_BOOTSTRAP_PASSWORD
  api:
    <<: *api
    restart: unless-stopped
    healthcheck:
      test: [CMD, java, -jar, /app/app.jar, --healthcheck]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
  web:
    image: adtek-platform-template-web:0.1.0
    restart: unless-stopped
    ports: ['127.0.0.1:18453:8443']
    secrets: [tls_certificate, tls_private_key]
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test:
        [CMD-SHELL, 'wget -q --no-check-certificate -O /dev/null https://127.0.0.1:8443/healthz']
      interval: 15s
      timeout: 5s
      retries: 5

secrets:
  ADTEK_DB_PASSWORD: { file: './.secrets/mysql-app-password' }
  ADTEK_MIGRATION_PASSWORD: { file: './.secrets/mysql-migration-password' }
  ADTEK_REDIS_PASSWORD: { file: './.secrets/redis-password' }
  ADTEK_JWT_SECRET: { file: './.secrets/jwt-signing-key' }
  ADTEK_BOOTSTRAP_PASSWORD: { file: './.secrets/bootstrap-admin-password' }
  tls_certificate: { file: './.secrets/local-tls-certificate.pem' }
  tls_private_key: { file: './.secrets/local-tls-private-key.pem' }

volumes:
  task_files:
