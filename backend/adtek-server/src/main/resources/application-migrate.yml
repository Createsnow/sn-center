# 单次数据库迁移：以 DDL 账号执行 Flyway 后进程退出（容器 / K8s Job 退出码 0 表示成功）。
# 运行中的 API 不激活本 profile，也不挂载迁移账号密码。
spring:
  main:
    web-application-type: none
    banner-mode: off
  datasource:
    username: ${ADTEK_MIGRATION_USER}
    password: ${ADTEK_MIGRATION_PASSWORD}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
    # 数据库可能晚于迁移任务就绪（compose 合并启动、K8s Job）；有限次重试后失败退出。
    connect-retries: 20
    connect-retries-interval: 5s
