spring:
  application:
    name: sn-center
  datasource:
    url: ${ADTEK_DB_URL}
    username: ${ADTEK_DB_USER}
    password: ${ADTEK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  # API 运行时不执行迁移、不持有 DDL 账号；迁移只通过 migrate profile 单次执行。
  flyway:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  forward-headers-strategy: none
  address: ${ADTEK_SERVER_ADDRESS:127.0.0.1}
  port: ${ADTEK_SERVER_PORT:18100}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
  global-config:
    banner: false
logging:
  pattern:
    level: '%5p [traceId=%X{traceId}]'
