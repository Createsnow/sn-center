spring:
  application:
    name: adtek-platform-template
  datasource:
    url: ${ADTEK_DB_URL}
    username: ${ADTEK_DB_USER}
    password: ${ADTEK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
  data:
    redis:
      host: ${ADTEK_REDIS_HOST}
      port: ${ADTEK_REDIS_PORT}
      password: ${ADTEK_REDIS_PASSWORD}
      connect-timeout: 2s
      timeout: 2s
  flyway:
    url: ${ADTEK_DB_URL}
    user: ${ADTEK_MIGRATION_USER}
    password: ${ADTEK_MIGRATION_PASSWORD}
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  forward-headers-strategy: none
  address: ${ADTEK_SERVER_ADDRESS:127.0.0.1}
  port: ${ADTEK_SERVER_PORT:18090}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
  global-config:
    banner: false
logging:
  pattern:
    level: '%5p [traceId=%X{traceId}]'
adtek:
  tasks:
    enabled: true
    max-attempts: 3
    lease-seconds: 30
    budget-seconds: 300
    retry-seconds: 3
    per-user-limit: 3
    queue-limit: 1000
    export-rows: 10000
    file-bytes: 16777216
    file-root: ${ADTEK_FILE_ROOT:./var/files}
  security:
    login-guard:
      maximum-failures: 5
      lock-seconds: 900
    issuer: adtek-platform-template
    audience: adtek-platform-template-web
    jwt-secret: ${ADTEK_JWT_SECRET}
    access-minutes: 15
    refresh-hours: 8
    cookie-secure: true
  rate-limit:
    policies:
      auth-login:
        path: /api/v1/system/auth/login
        subject-limit: 8
        source-limit: 100
        window-seconds: 60
      auth-refresh:
        path: /api/v1/system/auth/refresh
        subject-limit: 30
        source-limit: 100
        window-seconds: 60
