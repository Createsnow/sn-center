# Windows PowerShell shell runner: Node 24, Git, Docker Linux engine and Edge.
# Local commands are validated; no remote GitLab pipeline has been run.
stages: [verify]
template-checks:
  stage: verify
  tags: [windows-pwsh-docker]
  timeout: 30m
  script:
    - pwsh -NoProfile -File tools/bootstrap-build.ps1
    - pwsh -NoProfile -File tools/bootstrap-format.ps1
    - pwsh -NoProfile -File tools/pnpm.ps1 install --frozen-lockfile
    - pwsh -NoProfile -File tools/format.ps1 -Check
    - pwsh -NoProfile -File tools/verify.ps1 -Integration
    - pwsh -NoProfile -File tools/check-contract.ps1
    - node tools/check-docs.mjs
    - pwsh -NoProfile -File tools/verify-web.ps1
    - pwsh -NoProfile -File tools/verify-browser.ps1
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - backend/*/target/surefire-reports/TEST-*.xml
      - backend/*/target/failsafe-reports/TEST-*.xml
      - frontend/test-results/unit.json
      - frontend/test-results/browser.json
    reports:
      junit:
        - backend/*/target/surefire-reports/TEST-*.xml
        - backend/*/target/failsafe-reports/TEST-*.xml
