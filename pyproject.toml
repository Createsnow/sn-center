[project]
name = "sn-center"
version = "1.0.0"
description = "多工厂 SN 防重管控 · FastAPI + MySQL 8"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pymysql>=1.1",
  "httpx>=0.27,<1",
  "structlog",
  "openpyxl>=3.1",
  "tzdata",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migration/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# FastAPI 依赖注入写在参数默认值里
ignore = ["B008"]
