name: sn-center

# 连接 .env 里 DB_HOST / DB_PORT / DB_NAME 指向的 MySQL（如公司库 10.0.200.125:3306/sndb），不随附数据库。
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sn-center-api:1.0.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ENVIRONMENT: production
      CORS_ORIGINS: '["http://localhost","http://127.0.0.1"]'
      CORS_ALLOW_ANY_ORIGIN: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: sn-center-web:1.0.0
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

